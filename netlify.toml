[build]
  command = "npm run icons && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA-Fallback: alle Pfade auf index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service Worker darf nie aus dem Cache kommen, sonst bleiben Updates haengen
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Gehashte Assets sind unveraenderlich
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
